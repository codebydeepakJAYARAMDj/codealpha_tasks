<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Pro - Smart To-Do List</title>
    <meta name="description" content="Organize your tasks efficiently with TaskMaster Pro">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-tasks logo-icon"></i> TaskMaster Pro</h1>
            <p>Your personal productivity assistant</p>
        </header>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off">
            <div class="task-options">
                <select id="prioritySelect">
                    <option value="normal">Normal Priority</option>
                    <option value="high">High Priority</option>
                    <option value="low">Low Priority</option>
                </select>
                <input type="date" id="dueDateInput">
            </div>
            <button id="addTaskBtn"><i class="fas fa-plus"></i> Add</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <div class="sort-dropdown">
                <button class="sort-btn"><i class="fas fa-sort"></i> Sort</button>
                <div class="sort-content">
                    <a href="#" data-sort="date-added">Date Added</a>
                    <a href="#" data-sort="due-date">Due Date</a>
                    <a href="#" data-sort="priority">Priority</a>
                </div>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search tasks..." autocomplete="off">
            <i class="fas fa-search"></i>
        </div>

        <ul id="taskList">
            <!-- Tasks will be added here dynamically -->
        </ul>

        <div class="stats">
            <span id="taskCount">0 tasks remaining</span>
            <div class="action-buttons">
                <button id="exportTasks"><i class="fas fa-download"></i> Export</button>
                <button id="clearCompleted">Clear Completed</button>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast">
        <div class="toast-content">
            <i class="fas fa-check-circle"></i>
            <div class="message">
                <span class="toast-title">Success</span>
                <span class="toast-message"></span>
            </div>
        </div>
        <i class="fas fa-times close"></i>
        <div class="progress"></div>
    </div>

    <footer>
        <p>TaskMaster Pro - Your tasks are stored in your browser</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
